<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro — Focus Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ── Task panel — LEFT of the image ── -->
    <aside class="task-panel" id="taskPanel">
        <div class="task-header">
            <span class="task-title">Tasks</span>
            <span class="task-count" id="taskCount"></span>
        </div>
        <div class="task-input-row">
            <input type="text" class="task-input" id="taskInput" placeholder="Add a task…" maxlength="80"
                autocomplete="off">
            <button class="task-add-btn" id="taskAddBtn" title="Add task">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
            </button>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <div class="task-footer" id="taskFooter">No tasks yet</div>
    </aside>

    <!-- ── Scene: image + leaves + timer ── -->
    <div class="scene-container">
        <div class="falling-leaves"></div>

        <div class="pomodoro-timer" id="pomodoroTimer">

            <!-- Quick-action buttons (top-right corner of card) -->
            <div class="timer-actions">
                <button class="btn-action btn-mute" id="btnMute" title="Toggle sound">
                    <svg class="icon-sound" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                    </svg>
                    <svg class="icon-mute" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <line x1="23" y1="9" x2="17" y2="15" />
                        <line x1="17" y1="9" x2="23" y2="15" />
                    </svg>
                </button>
                <button class="btn-action btn-settings" id="btnSettings" title="Settings">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </button>
            </div>

            <!-- Mode tabs -->
            <div class="timer-modes">
                <button class="mode-btn active" data-mode="pomodoro" id="modePomodoro">Pomodoro</button>
                <button class="mode-btn" data-mode="short" id="modeShort">Short Break</button>
                <button class="mode-btn" data-mode="long" id="modeLong">Long Break</button>
            </div>

            <!-- Ring + time -->
            <div class="timer-ring-wrapper">
                <svg class="timer-svg" viewBox="0 0 240 240">
                    <circle class="ring-bg" cx="120" cy="120" r="102" />
                    <circle class="ring-progress" cx="120" cy="120" r="102" id="ringProgress" />
                </svg>
                <div class="timer-center">
                    <span class="timer-time" id="timerDisplay">25:00</span>
                    <span class="timer-label" id="timerLabel">Focus</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="timer-controls">
                <button class="btn-icon btn-reset" id="btnReset" title="Reset">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                </button>
                <button class="btn-start" id="btnStart">Start</button>
                <button class="btn-icon btn-skip" id="btnSkip" title="Skip">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 4 15 12 5 20 5 4" />
                        <line x1="19" y1="5" x2="19" y2="19" />
                    </svg>
                </button>
            </div>

            <!-- Session dots -->
            <div class="session-tracker" id="sessionTracker">
                <div class="session-dot"></div>
                <div class="session-dot"></div>
                <div class="session-dot"></div>
                <div class="session-dot"></div>
            </div>

            <!-- Lofi music indicator (shown during breaks) -->
            <div class="music-indicator" id="musicIndicator">
                <span class="music-bars">
                    <span></span><span></span><span></span><span></span>
                </span>
                <span class="music-label">Lofi playing</span>
            </div>

        </div><!-- /.pomodoro-timer -->
    </div><!-- /.scene-container -->

    <!-- ── Music panel — RIGHT of the image ── -->
    <aside class="music-panel" id="musicPanel">
        <div class="music-header">
            <span class="music-title">Music</span>
            <button class="music-refresh-btn" id="btnRefresh" title="Refresh music list (run scan-music.py first)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            </button>
        </div>
        
        <ul class="music-list" id="musicList"></ul>
        
        <!-- Player controls -->
        <div class="music-player" id="musicPlayer" style="display:none">
            <div class="now-playing">
                <div class="now-playing-name" id="nowPlayingName">No track playing</div>
            </div>
            
            <div class="player-progress">
                <span class="time-current" id="timeCurrent">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
                <span class="time-total" id="timeTotal">0:00</span>
            </div>
            
            <div class="player-controls">
                <button class="control-btn" id="btnPrev" title="Previous">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="control-btn control-play" id="btnPlayPause" title="Play">
                    <svg class="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <svg class="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                </button>
                <button class="control-btn" id="btnNext" title="Next">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16 18h2V6h-2zm-11-6l8.5-6v12z"/>
                    </svg>
                </button>
                <div class="volume-control">
                    <button class="control-btn" id="btnVolume" title="Volume">
                        <svg class="volume-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        <svg class="mute-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                            <line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2"/>
                            <line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
                </div>
            </div>
        </div>
    </aside>

    <!-- ── Settings overlay (full-screen modal) ── -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-modal">

            <div class="settings-header">
                <span class="settings-title">Settings</span>
                <button class="settings-close" id="settingsClose">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <div class="settings-body">

                <div class="settings-section-label">Timer durations</div>

                <div class="setting-row">
                    <label class="setting-label" for="settingPomodoro">Focus</label>
                    <div class="setting-control">
                        <input type="number" class="setting-input" id="settingPomodoro" min="1" max="99" value="25">
                        <span class="setting-unit">min</span>
                    </div>
                </div>

                <div class="setting-row">
                    <label class="setting-label" for="settingShort">Short break</label>
                    <div class="setting-control">
                        <input type="number" class="setting-input" id="settingShort" min="1" max="30" value="5">
                        <span class="setting-unit">min</span>
                    </div>
                </div>

                <div class="setting-row">
                    <label class="setting-label" for="settingLong">Long break</label>
                    <div class="setting-control">
                        <input type="number" class="setting-input" id="settingLong" min="1" max="60" value="15">
                        <span class="setting-unit">min</span>
                    </div>
                </div>

                <div class="setting-row">
                    <label class="setting-label" for="settingSessions">Long break every</label>
                    <div class="setting-control">
                        <input type="number" class="setting-input" id="settingSessions" min="1" max="10" value="4">
                        <span class="setting-unit">sessions</span>
                    </div>
                </div>

                <div class="settings-divider"></div>
                <div class="settings-section-label">Sound</div>

                <div class="setting-row">
                    <label class="setting-label" for="settingSound">Session end chime</label>
                    <label class="toggle">
                        <input type="checkbox" id="settingSound" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="setting-row">
                    <label class="setting-label" for="settingVolume">Chime volume</label>
                    <div class="setting-control">
                        <input type="range" class="setting-range" id="settingVolume" min="0" max="100" value="60">
                        <span class="setting-unit" id="settingVolumeLabel">60%</span>
                    </div>
                </div>

                <div class="settings-divider"></div>
                <div class="settings-section-label">Lofi music on breaks</div>

                <div class="setting-row">
                    <label class="setting-label" for="settingLofi">Play lofi on breaks</label>
                    <label class="toggle">
                        <input type="checkbox" id="settingLofi" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="setting-row">
                    <label class="setting-label" for="settingLofiVolume">Lofi volume</label>
                    <div class="setting-control">
                        <input type="range" class="setting-range" id="settingLofiVolume" min="0" max="100" value="40">
                        <span class="setting-unit" id="settingLofiVolumeLabel">40%</span>
                    </div>
                </div>

            </div>

            <div class="settings-footer">
                <button class="settings-cancel" id="settingsCancel">Cancel</button>
                <button class="settings-save" id="settingsSave">Apply</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script src="timer.js"></script>
    <script src="tasks.js"></script>
    <script src="music.js"></script>
</body>

</html>
