<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro — Focus Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="falling-leaves"></div>

    <div class="pomodoro-timer" id="pomodoroTimer">

        <!-- Mode tabs -->
        <div class="timer-modes">
            <button class="mode-btn active" data-mode="pomodoro" id="modePomodoro">Pomodoro</button>
            <button class="mode-btn" data-mode="short"    id="modeShort">Short Break</button>
            <button class="mode-btn" data-mode="long"     id="modeLong">Long Break</button>
        </div>

        <!-- SVG ring + time display -->
        <div class="timer-ring-wrapper">
            <svg class="timer-svg" viewBox="0 0 240 240">
                <circle class="ring-bg"       cx="120" cy="120" r="102"/>
                <circle class="ring-progress" cx="120" cy="120" r="102" id="ringProgress"/>
            </svg>
            <div class="timer-center">
                <span class="timer-time"  id="timerDisplay">25:00</span>
                <span class="timer-label" id="timerLabel">Focus</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="timer-controls">
            <button class="btn-icon btn-reset" id="btnReset" title="Reset">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            </button>
            <button class="btn-start" id="btnStart">Start</button>
            <button class="btn-icon btn-skip" id="btnSkip" title="Skip">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 4 15 12 5 20 5 4"/>
                    <line x1="19" y1="5" x2="19" y2="19"/>
                </svg>
            </button>
        </div>

        <!-- Session dots -->
        <div class="session-tracker" id="sessionTracker">
            <div class="session-dot"></div>
            <div class="session-dot"></div>
            <div class="session-dot"></div>
            <div class="session-dot"></div>
        </div>

    </div>

    <script src="script.js"></script>
    <script src="timer.js"></script>
</body>
</html>
