<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro — The Endless Horizon</title>
  <meta name="description" content="A beautiful Pomodoro timer set against living ocean scenes. Stay focused with a calming animated horizon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="webgl_canvas"></canvas>

  <!-- HUD — scene name & mini progress -->
  <div id="hud">
    <div class="scene-label" id="scene_name">DAWN</div>
    <div class="progress-bar">
      <div class="progress-fill" id="prog_fill"></div>
    </div>
  </div>

  <!-- Theme toggle -->
  <button id="theme_toggle" aria-label="Toggle light/dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
    </svg>
  </button>

  <!-- Scene dots -->
  <div id="scene_strip">
    <div class="scene-dot active" title="Dawn"></div>
    <div class="scene-dot" title="Midday"></div>
    <div class="scene-dot" title="Dusk"></div>
    <div class="scene-dot" title="Night"></div>
    <div class="scene-dot" title="Storm"></div>
  </div>

  <!-- Pomodoro Timer Card -->
  <div id="timer_container">
    <div class="timer-card">
      <div id="mode_tag" class="mode-tag">FOCUS SESSION</div>

      <div id="timer_ring_wrap">
        <svg id="timer_ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-bg" cx="100" cy="100" r="88" />
          <circle id="ring_progress" class="ring-fill" cx="100" cy="100" r="88" />
        </svg>
        <div id="timer_display" class="timer-display" title="Click to edit time">25:00</div>
        <input
          id="timer_input"
          class="timer-input"
          type="text"
          maxlength="5"
          placeholder="25:00"
          aria-label="Edit timer duration"
        />
      </div>

      <div id="edit_hint" class="edit-hint">✎ click time to edit</div>

      <div class="session-counter">
        Session <span id="session_num">1</span> of 4
      </div>

      <!-- Controls -->
      <div class="timer-controls">
        <button id="btn_reset" class="ctrl-btn ctrl-secondary" aria-label="Reset timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>

        <button id="btn_start" class="ctrl-btn ctrl-primary" aria-label="Start or pause timer">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>

        <button id="btn_skip" class="ctrl-btn ctrl-secondary" aria-label="Skip to next session">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M5 4l10 8-10 8V4z" />
            <line x1="19" y1="4" x2="19" y2="20" />
          </svg>
        </button>
      </div>

      <!-- Mode switcher -->
      <div class="mode-switcher">
        <button id="btn_work" class="mode-btn active" aria-pressed="true">Focus 25m</button>
        <button id="btn_short" class="mode-btn" aria-pressed="false">Short Break 5m</button>
        <button id="btn_long" class="mode-btn" aria-pressed="false">Long Break 15m</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
